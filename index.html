<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Голосование Theandarameda</title>
<style>
:root{
  --bg:#15112e; --surface:#211b45; --surface2:#2d2660; --line:#3b3373;
  --text:#f1ecff; --muted:#a79fd0; --accent:#f0629b; --gold:#ffc857; --danger:#ff6b6b;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100vh; color:var(--text); line-height:1.5;
  font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  background:
    radial-gradient(ellipse 60% 40% at 78% -5%, rgba(240,98,155,.28), transparent 70%),
    radial-gradient(ellipse 70% 50% at 10% 0%, rgba(96,80,230,.35), transparent 70%),
    var(--bg);
  background-attachment:fixed;
}
.wrap{max-width:760px; margin:0 auto; padding:0 16px 48px}
header{padding:36px 0 18px}
header h1{
  margin:0; font-family:Georgia,"Times New Roman",serif; font-weight:700;
  font-size:clamp(28px,7vw,44px); line-height:1.1; letter-spacing:-.01em;
}
header p{margin:8px 0 0; color:var(--muted)}

/* ===== Меню категорий: на телефоне — вкладки сверху ===== */
.topbar{
  position:sticky; top:0; z-index:5; margin:0 -16px;
  background:rgba(21,17,46,.94); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.tabs{
  display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; padding:10px 16px;
}
.tabs::-webkit-scrollbar{display:none}
.tabs.sub{padding-top:0}
.tab{
  flex:0 0 auto; min-height:42px; padding:0 16px; border-radius:21px;
  border:1px solid var(--line); background:transparent; color:var(--muted);
  font:inherit; font-size:15px; cursor:pointer; white-space:nowrap;
}
.tab:hover{color:var(--text); border-color:var(--muted)}
.tab.on{background:var(--text); color:var(--bg); border-color:var(--text); font-weight:600}
.tab.in{color:var(--text); border-color:var(--gold)}
.tab.add{border-style:dashed; color:var(--gold); border-color:var(--gold)}
.tabs.sub .tab{min-height:36px; padding:0 14px; font-size:14px; background:var(--surface)}
.tabs.sub .tab.on{background:var(--gold); border-color:var(--gold); color:var(--bg)}

/* ===== Меню категорий: на ПК — колонка слева ===== */
.side{display:none}
.sitem{
  display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%;
  min-height:40px; padding:8px 12px; border:0; border-radius:10px; background:transparent;
  color:var(--muted); font:inherit; font-size:15px; text-align:left; cursor:pointer;
}
.sitem span{min-width:0; overflow-wrap:anywhere}
.sitem:hover{background:var(--surface); color:var(--text)}
.sitem.on{background:var(--text); color:var(--bg); font-weight:600}
.sitem.add{color:var(--gold); border:1px dashed var(--gold); margin-top:10px; justify-content:center}
.sitem.add:hover{background:rgba(255,200,87,.1)}
.sitem i{font-style:normal; font-size:12px; flex:0 0 auto; padding:1px 7px; border-radius:10px; background:var(--surface2); color:var(--muted)}
.sitem i.ok{background:rgba(255,200,87,.2); color:var(--gold)}
.sitem.on i{background:rgba(21,17,46,.12); color:var(--bg)}
.ssubs{margin:2px 0 6px 14px; padding-left:8px; border-left:1px solid var(--line)}
.sitem.sub{min-height:34px; font-size:14px}

main{padding-top:22px; min-width:0}
h2{margin:0 0 6px; font-family:Georgia,serif; font-size:26px; line-height:1.2}
.desc{margin:0 0 20px; color:var(--muted); white-space:pre-wrap; max-width:62ch}
.rules{white-space:pre-wrap; max-width:62ch}
.empty{color:var(--muted); padding:18px; border:1px dashed var(--line); border-radius:14px}
.crumb{
  display:inline-block; margin:0 0 8px; padding:6px 0; min-height:32px; border:0; background:none;
  color:var(--gold); font:inherit; font-size:14px; font-weight:600; cursor:pointer;
}
.crumb:hover{text-decoration:underline}

/* Карточки подкатегорий */
.subgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; margin:0 0 22px}
.subcard{
  display:flex; flex-direction:column; gap:4px; text-align:left; padding:16px; cursor:pointer;
  border:1px solid var(--line); border-radius:16px; background:var(--surface); color:var(--text);
  font:inherit; transition:border-color .15s, transform .15s;
}
.subcard:hover{border-color:var(--gold); transform:translateY(-2px)}
.subcard b{font-size:17px; overflow-wrap:anywhere}
.subcard .sd{
  color:var(--muted); font-size:14px; overflow-wrap:anywhere;
  display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; line-clamp:2; overflow:hidden;
}
.subcard em{font-style:normal; font-size:13px; color:var(--muted); margin-top:4px}
.subcard em.ok{color:var(--gold); font-weight:600}
h3.sect{margin:26px 0 12px; font-size:16px; color:var(--muted); font-weight:600}

.cand{
  position:relative; overflow:hidden; margin-bottom:12px;
  border:1px solid var(--line); border-radius:16px; background:var(--surface);
}
.cand .fill{
  position:absolute; inset:0 auto 0 0; width:var(--p,0%);
  background:linear-gradient(90deg, rgba(240,98,155,.30), rgba(240,98,155,.12));
  transition:width .6s ease;
}
.cand.lead{border-color:var(--gold)}
.cand.lead .fill{background:linear-gradient(90deg, rgba(255,200,87,.34), rgba(255,200,87,.10))}
.cbody{position:relative; display:flex; align-items:center; gap:14px; padding:14px 16px}
.cbody img{width:56px; height:56px; border-radius:50%; object-fit:cover; background:var(--surface2); flex:0 0 auto}
.ctext{flex:1; min-width:0}
.ctext h3{margin:0; font-size:18px; overflow-wrap:anywhere}
.ctext p{margin:2px 0 0; color:var(--muted); font-size:14px; overflow-wrap:anywhere}
.ctext p.cdesc{
  display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; line-clamp:2; overflow:hidden;
}
.more{
  display:inline-block; margin:2px 0 0; padding:4px 0; min-height:32px; border:0; background:none;
  color:var(--gold); font-size:14px; font-weight:600; cursor:pointer;
}
.more[hidden]{display:none}
.avatar{
  position:relative; flex:0 0 auto; width:56px; height:56px; padding:0; border:0; border-radius:50%;
  background:none; cursor:zoom-in; -webkit-tap-highlight-color:transparent;
}
.avatar::after{
  content:"⤢"; position:absolute; right:-2px; bottom:-2px; width:20px; height:20px; border-radius:50%;
  background:var(--text); color:var(--bg); font-size:13px; line-height:20px; text-align:center;
  box-shadow:0 0 0 2px var(--surface);
}
.cnum{text-align:right; flex:0 0 auto}
.cnum b{display:block; font-size:24px; font-family:Georgia,serif}
.cnum span{font-size:13px; color:var(--muted)}
.cactions{position:relative; display:flex; gap:8px; flex-wrap:wrap; padding:0 16px 14px; align-items:center}

button,.btn{font:inherit}
.btn{
  min-height:44px; padding:0 18px; border-radius:12px; border:0; cursor:pointer;
  background:var(--accent); color:#fff; font-weight:600; font-size:15px;
}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn.ghost{background:transparent; border:1px solid var(--line); color:var(--text); font-weight:500}
.btn.ghost:hover:not(:disabled){border-color:var(--muted); background:var(--surface2); filter:none}
.btn.danger{background:transparent; border:1px solid var(--danger); color:var(--danger); font-weight:500}
.btn.danger:hover:not(:disabled){background:rgba(255,107,107,.12); filter:none}
.btn.sm{min-height:38px; padding:0 14px; font-size:14px}
.btn:disabled{opacity:.5; cursor:default}
.mine{color:var(--gold); font-weight:600; font-size:15px}

.total{margin:6px 0 0; color:var(--muted); font-size:14px}
.card{margin-top:22px; padding:16px; border:1px solid var(--line); border-radius:16px; background:var(--surface)}
.card h3{margin:0 0 12px; font-size:16px}
label{display:block; margin:0 0 12px; font-size:14px; color:var(--muted)}
input,textarea,select{
  display:block; width:100%; margin-top:6px; padding:11px 12px; border-radius:10px;
  border:1px solid var(--line); background:var(--bg); color:var(--text); font:inherit; font-size:16px;
}
select{cursor:pointer}
textarea{min-height:110px; resize:vertical}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--gold); outline-offset:2px}
.row{display:flex; gap:8px; flex-wrap:wrap}

footer{margin-top:40px; text-align:center}
footer button{background:none; border:0; color:var(--muted); font-size:13px; cursor:pointer; padding:10px; text-decoration:underline}

dialog{border:1px solid var(--line); border-radius:18px; background:var(--surface); color:var(--text); width:min(92vw,380px); padding:22px}
dialog::backdrop{background:rgba(5,3,20,.7)}
body:has(dialog[open]){overflow:hidden}

/* Фото на весь экран */
#zoom{
  width:100vw; height:100vh; height:100dvh; max-width:none; max-height:none; margin:0; padding:0;
  border:0; border-radius:0; background:rgba(0,0,0,.96); color:#fff; overflow:hidden;
}
#zoom[open]{display:flex; align-items:center; justify-content:center}
#zoom::backdrop{background:#000}
#zimg{width:100%; height:100%; object-fit:contain; display:block}
#zclose{
  position:absolute; top:calc(env(safe-area-inset-top,0px) + 12px); right:12px; z-index:2;
  width:44px; height:44px; border-radius:50%; border:0; background:rgba(255,255,255,.18);
  color:#fff; font-size:20px; cursor:pointer; backdrop-filter:blur(6px);
}
#zcap{
  position:absolute; left:0; right:0; bottom:0; padding:32px 16px calc(env(safe-area-inset-bottom,0px) + 16px);
  background:linear-gradient(transparent, rgba(0,0,0,.75)); font-weight:600; font-size:18px; text-align:center;
  pointer-events:none;
}

/* Описание в отдельном окне (снизу) */
#sheet{
  width:100%; max-width:560px; margin:auto auto 0; padding:0; overflow:hidden;
  border:1px solid var(--line); border-bottom:0; border-radius:20px 20px 0 0;
}
#sheet[open]{animation:sheetUp .22s ease-out}
@keyframes sheetUp{from{transform:translateY(40px); opacity:0} to{transform:none; opacity:1}}
.sbox{display:flex; flex-direction:column; max-height:75vh; max-height:75dvh}
.shead{display:flex; align-items:center; gap:12px; padding:16px 16px 12px; border-bottom:1px solid var(--line)}
.shead img{width:44px; height:44px; border-radius:50%; object-fit:cover; background:var(--surface2); flex:0 0 auto}
.shead h3{margin:0; flex:1; min-width:0; font-size:18px; overflow-wrap:anywhere}
.shead button{
  flex:0 0 auto; width:40px; height:40px; border-radius:50%; border:1px solid var(--line);
  background:transparent; color:var(--text); font-size:18px; cursor:pointer;
}
#stext{
  overflow-y:auto; -webkit-overflow-scrolling:touch; padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 22px);
  white-space:pre-wrap; overflow-wrap:anywhere; line-height:1.55;
}
.err{color:var(--danger); font-size:14px; min-height:20px; margin:0 0 8px}

#toast{
  position:fixed; left:50%; bottom:24px; transform:translate(-50%,20px); opacity:0;
  background:var(--text); color:var(--bg); padding:12px 18px; border-radius:12px;
  font-weight:600; transition:.25s; pointer-events:none; z-index:20; max-width:90vw; text-align:center;
}
#toast.show{opacity:1; transform:translate(-50%,0)}

/* ===== Компьютер: широкая раскладка с меню слева ===== */
@media (min-width:900px){
  .wrap{max-width:1180px; padding:0 32px 64px}
  header{padding:44px 0 26px}
  .topbar{display:none}
  .layout{display:grid; grid-template-columns:270px minmax(0,1fr); gap:44px; align-items:start}
  .side{
    display:block; position:sticky; top:20px; max-height:calc(100vh - 40px); overflow-y:auto;
    padding:12px; border:1px solid var(--line); border-radius:18px; background:rgba(33,27,69,.7);
    scrollbar-width:thin; scrollbar-color:var(--line) transparent;
  }
  main{padding-top:4px; max-width:860px}
  h2{font-size:32px; margin-bottom:8px}
  .cbody{padding:16px 20px; gap:18px}
  .cbody img,.avatar{width:68px; height:68px}
  .cand{transition:border-color .15s, transform .15s}
  .cand:hover{transform:translateY(-1px)}
  .cactions{padding:0 20px 16px}
  .card{padding:20px}
  .admin-pair{display:grid; grid-template-columns:1fr 1fr; gap:20px; align-items:start}
  .admin-pair .card{margin-top:22px}
  /* окно описания по центру, а не снизу */
  #sheet{margin:auto; border-bottom:1px solid var(--line); border-radius:20px; max-width:600px}
  #sheet[open]{animation:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">Голосование</h1>
  </header>
  <div class="topbar">
    <nav id="nav" class="tabs"></nav>
    <nav id="subnav" class="tabs sub" hidden></nav>
  </div>
  <div class="layout">
    <aside id="side" class="side" aria-label="Категории"></aside>
    <main id="main"><div class="empty">Загрузка…</div></main>
  </div>
  <footer id="foot"></footer>
</div>

<dialog id="dlg">
  <form id="loginForm">
    <h3 style="margin:0 0 14px">Вход для администратора</h3>
    <label>Почта<input id="lEmail" type="email" autocomplete="username" required></label>
    <label>Пароль<input id="lPass" type="password" autocomplete="current-password" required></label>
    <p class="err" id="lErr"></p>
    <div class="row">
      <button class="btn" type="submit">Войти</button>
      <button class="btn ghost" type="button" id="lCancel">Отмена</button>
    </div>
  </form>
</dialog>
<dialog id="zoom" aria-label="Фото кандидата">
  <button id="zclose" type="button" aria-label="Закрыть">✕</button>
  <img id="zimg" alt="">
  <div id="zcap"></div>
</dialog>

<dialog id="sheet" aria-label="Описание кандидата">
  <div class="sbox">
    <div class="shead">
      <img id="simg" alt="" hidden>
      <h3 id="sname"></h3>
      <button id="sclose" type="button" aria-label="Закрыть">✕</button>
    </div>
    <div id="stext"></div>
  </div>
</dialog>
<input type="file" id="imgPick" accept="image/*" style="display:none!important">
<div id="toast"></div>

<script>
/* ===== Настройки Supabase ===== */
const SB_URL = 'https://igbtqfsqoefyyugnxcmd.supabase.co';
const SB_KEY = 'sb_publishable_uc7ud37f9GEdhFIxP1C-dw_r1kIgRoI';

/* ===== Состояние ===== */
const LS = 'tap_session_v1';
let session = null;
try { session = JSON.parse(localStorage.getItem(LS) || 'null'); } catch (e) {}
const S = { title:'Голосование', rules:'', cats:[], cands:[], res:{}, mine:{}, tab:'rules', newParent:'', admin:false, loaded:false, error:'', hashDone:false };

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function plural(n, a, b, c){ const m=n%10, h=n%100; return (m===1&&h!==11)?a:(m>=2&&m<=4&&(h<10||h>=20))?b:c; }
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('show'),2600); }

/* ===== Категории и подкатегории ===== */
const catById = id => S.cats.find(c => c.id === id);
const tops = () => S.cats.filter(c => !c.parent_id || !catById(c.parent_id));
const subsOf = id => S.cats.filter(c => c.parent_id === id);
const topIdOf = id => { const c = catById(id); return c ? (c.parent_id && catById(c.parent_id) ? c.parent_id : c.id) : null; };
const candCount = id => S.cands.filter(c => c.category_id === id).length;

function setTab(t, parent){
  S.tab = t; S.newParent = parent || '';
  try { history.replaceState(null, '', (t === 'rules' || t === 'new') ? location.pathname + location.search : '#' + t); } catch (e) {}
  render(); window.scrollTo({ top:0 });
}

/* ===== Авторизация (REST, без библиотек) ===== */
async function authPost(path, body, token){
  const h = { apikey:SB_KEY, 'Content-Type':'application/json' };
  if (token) h.Authorization = 'Bearer ' + token;
  const r = await fetch(SB_URL + '/auth/v1' + path, { method:'POST', headers:h, body:JSON.stringify(body || {}) });
  try { return await r.json(); } catch (e) { return {}; }
}
function saveSession(s){
  if (s && s.access_token){
    if (!s.expires_at) s.expires_at = Math.floor(Date.now()/1000) + (s.expires_in || 3600);
    session = s; localStorage.setItem(LS, JSON.stringify(s)); return true;
  }
  return false;
}
function dropSession(){ session = null; localStorage.removeItem(LS); }

let sessP = null;
function ensureSession(){
  if (!sessP) sessP = (async () => {
    try {
      const now = Date.now()/1000;
      if (session && session.expires_at - 60 > now) return;
      if (session && session.refresh_token){
        const r = await authPost('/token?grant_type=refresh_token', { refresh_token:session.refresh_token });
        if (saveSession(r)) return;
        dropSession();
      }
      saveSession(await authPost('/signup', {}));   // анонимный вход
    } catch (e) {}
  })().finally(() => { sessP = null; });
  return sessP;
}

/* ===== REST API ===== */
async function api(method, path, body, prefer){
  await ensureSession();
  const h = { apikey:SB_KEY, 'Content-Type':'application/json' };
  if (session) h.Authorization = 'Bearer ' + session.access_token;
  if (prefer) h.Prefer = prefer;
  const r = await fetch(SB_URL + '/rest/v1/' + path, { method, headers:h, body: body===undefined ? undefined : JSON.stringify(body) });
  const t = await r.text();
  let j = null; try { j = t ? JSON.parse(t) : null; } catch (e) {}
  if (!r.ok){
    const err = new Error((j && (j.message || j.hint)) || ('Ошибка ' + r.status));
    err.code = j && j.code; err.status = r.status; throw err;
  }
  return j;
}

/* ===== Загрузка данных ===== */
async function loadResults(){
  const [res, mine] = await Promise.all([
    api('GET', 'candidate_results?select=*'),
    session ? api('GET', 'votes?select=category_id,candidate_id') : Promise.resolve([])
  ]);
  S.res = {}; res.forEach(r => S.res[r.candidate_id] = r.votes);
  S.mine = {}; mine.forEach(v => S.mine[v.category_id] = v.candidate_id);
}
function fixTab(){
  if (S.tab === 'new'){ if (!S.admin) S.tab = 'rules'; return; }
  if (S.tab !== 'rules' && !catById(S.tab)) S.tab = 'rules';
}
async function loadAll(){
  await ensureSession();
  try {
    const [st, cats, cands] = await Promise.all([
      api('GET', 'settings?select=*&id=eq.1'),
      api('GET', 'categories?select=*&order=created_at'),
      api('GET', 'candidates?select=*&order=created_at')
    ]);
    S.title = (st[0] && st[0].title) || 'Голосование';
    S.rules = (st[0] && st[0].rules) || '';
    S.cats = cats; S.cands = cands;
    await loadResults();
    S.admin = session ? (await api('POST', 'rpc/is_admin', {})) === true : false;
    S.error = '';
  } catch (e) {
    S.error = 'Не удалось загрузить данные. Проверь, что выполнен setup.sql. (' + e.message + ')';
  }
  S.loaded = true;
  if (!S.hashDone){            // открыть категорию по ссылке вида …#id
    S.hashDone = true;
    const h = location.hash.slice(1);
    if (h && catById(h)) S.tab = h;
  }
  fixTab();
  render();
}

/* ===== Отрисовка ===== */
function mark(c){
  const subs = subsOf(c.id);
  if (subs.length){
    const n = subs.filter(s => S.mine[s.id]).length;
    return `<i class="${n === subs.length ? 'ok' : ''}">${n}/${subs.length}</i>`;
  }
  return S.mine[c.id] ? '<i class="ok">✓</i>' : '';
}

function renderNav(){
  const activeTop = S.tab === 'rules' || S.tab === 'new' ? null : topIdOf(S.tab);

  /* телефон: верхние вкладки */
  let nav = `<button class="tab ${S.tab==='rules'?'on':''}" data-tab="rules">Правила</button>`;
  tops().forEach(c => nav += `<button class="tab ${S.tab===c.id?'on':activeTop===c.id?'in':''}" data-tab="${c.id}">${esc(c.name)}</button>`);
  if (S.admin) nav += `<button class="tab add ${S.tab==='new'?'on':''}" data-tab="new">+ Категория</button>`;
  $('#nav').innerHTML = nav;

  /* телефон: подкатегории выбранной категории */
  const subs = activeTop ? subsOf(activeTop) : [];
  $('#subnav').hidden = !subs.length;
  $('#subnav').innerHTML = subs.length
    ? `<button class="tab ${S.tab===activeTop?'on':''}" data-tab="${activeTop}">Все</button>` +
      subs.map(s => `<button class="tab ${S.tab===s.id?'on':''}" data-tab="${s.id}">${esc(s.name)}</button>`).join('')
    : '';

  /* компьютер: дерево слева */
  let side = `<button class="sitem ${S.tab==='rules'?'on':''}" data-tab="rules"><span>Правила</span></button>`;
  tops().forEach(c => {
    const ss = subsOf(c.id);
    side += `<button class="sitem ${S.tab===c.id?'on':''}" data-tab="${c.id}"><span>${esc(c.name)}</span>${mark(c)}</button>`;
    if (ss.length) side += '<div class="ssubs">' +
      ss.map(s => `<button class="sitem sub ${S.tab===s.id?'on':''}" data-tab="${s.id}"><span>${esc(s.name)}</span>${mark(s)}</button>`).join('') + '</div>';
  });
  if (S.admin) side += `<button class="sitem add ${S.tab==='new'?'on':''}" data-tab="new">+ Категория</button>`;
  $('#side').innerHTML = side;

  /* телефон: прокрутить вкладки к активной */
  requestAnimationFrame(() => {
    ['#nav', '#subnav'].forEach(sel => {
      const box = $(sel), el = box && box.querySelector('.tab.on, .tab.in');
      if (box && el && box.scrollWidth > box.clientWidth) box.scrollLeft = el.offsetLeft - box.clientWidth/2 + el.offsetWidth/2;
    });
  });
}

function render(){
  document.title = S.title;
  $('#title').textContent = S.title;
  renderNav();

  $('#foot').innerHTML = S.admin
    ? '<button data-act="logout">Выйти из режима администратора</button>'
    : '<button data-act="login-open">Вход для администратора</button>';

  let html = '';
  if (S.error) html = `<div class="empty">${esc(S.error)}</div>`;
  else if (!S.loaded) html = '<div class="empty">Загрузка…</div>';
  else if (S.tab === 'rules') html = renderRules();
  else if (S.tab === 'new') html = renderNewCat();
  else html = renderCat(catById(S.tab));
  $('#main').innerHTML = html;
  requestAnimationFrame(measureClamp);
}

/* Колесо мыши листает ряд вкладок вбок (если окно узкое и вкладок много) */
document.querySelectorAll('.tabs').forEach(n => n.addEventListener('wheel', e => {
  if (n.scrollWidth > n.clientWidth && Math.abs(e.deltaY) > Math.abs(e.deltaX)){ n.scrollLeft += e.deltaY; e.preventDefault(); }
}, { passive:false }));

/* Кнопка «Далее» показывается только если описание не влезло в 2 строки */
function measureClamp(){
  document.querySelectorAll('.cdesc').forEach(p => {
    const b = p.parentNode.querySelector('.more');
    if (b) b.hidden = !(p.scrollHeight > p.clientHeight + 1);
  });
}
window.addEventListener('resize', measureClamp);
window.addEventListener('orientationchange', measureClamp);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(measureClamp);

/* Фото на весь экран */
function openZoom(id){
  const c = S.cands.find(x => x.id === id); if (!c || !c.image_url) return;
  $('#zimg').src = c.image_url;
  $('#zcap').textContent = c.name;
  $('#zoom').showModal();
}
$('#zoom').addEventListener('click', () => $('#zoom').close());
$('#zoom').addEventListener('close', () => { $('#zimg').removeAttribute('src'); });

/* Описание в отдельном окне */
function openSheet(id){
  const c = S.cands.find(x => x.id === id); if (!c) return;
  const im = $('#simg');
  if (c.image_url){ im.src = c.image_url; im.hidden = false; } else { im.hidden = true; im.removeAttribute('src'); }
  $('#sname').textContent = c.name;
  $('#stext').textContent = c.description || '';
  $('#stext').scrollTop = 0;
  $('#sheet').showModal();
}
$('#sclose').addEventListener('click', () => $('#sheet').close());
$('#sheet').addEventListener('click', e => { if (e.target === $('#sheet')) $('#sheet').close(); });

function renderRules(){
  let h = '<h2>Общие правила</h2>';
  h += S.rules.trim() ? `<div class="rules">${esc(S.rules)}</div>` : '<div class="empty">Правила пока не добавлены.</div>';
  if (S.admin){
    h += `<div class="card"><h3>Редактировать</h3>
      <label>Название сайта<input id="fTitle" maxlength="80" value="${esc(S.title)}"></label>
      <label>Общие правила<textarea id="fRules">${esc(S.rules)}</textarea></label>
      <button class="btn" data-act="save-rules">Сохранить</button></div>`;
  }
  return h;
}

function renderNewCat(){
  const opts = tops().map(c => `<option value="${c.id}" ${S.newParent===c.id?'selected':''}>${esc(c.name)}</option>`).join('');
  return `<h2>Новая категория</h2>
    <div class="card">
      <label>Где создать
        <select id="nParent"><option value="">Основная категория</option>${opts}</select>
      </label>
      <label>Название<input id="nName" maxlength="60" placeholder="Например: Лучший клип"></label>
      <label>Описание — что нужно делать в этом разделе<textarea id="nDesc" maxlength="1000"></textarea></label>
      <button class="btn" data-act="add-cat">Создать</button>
    </div>`;
}

function renderCat(cat){
  if (!cat) return '<div class="empty">Категория не найдена.</div>';
  const subs = subsOf(cat.id);
  const parent = cat.parent_id ? catById(cat.parent_id) : null;
  const list = S.cands.filter(c => c.category_id === cat.id)
    .sort((a, b) => (S.res[b.id] || 0) - (S.res[a.id] || 0));   // больше голосов — выше
  const total = list.reduce((s, c) => s + (S.res[c.id] || 0), 0);
  const max = Math.max(0, ...list.map(c => S.res[c.id] || 0));
  const voted = S.mine[cat.id];

  PEND = [];
  let h = '';
  if (parent) h += `<button type="button" class="crumb" data-tab="${parent.id}">← ${esc(parent.name)}</button>`;
  h += `<h2>${esc(cat.name)}</h2>`;
  if ((cat.description || '').trim()) h += `<p class="desc">${esc(cat.description)}</p>`;

  /* подкатегории */
  if (subs.length){
    h += '<div class="subgrid">';
    subs.forEach(s => {
      const n = candCount(s.id), ok = S.mine[s.id];
      h += `<button type="button" class="subcard" data-tab="${s.id}">
        <b>${esc(s.name)}</b>
        ${(s.description || '').trim() ? `<span class="sd">${esc(s.description)}</span>` : ''}
        <em class="${ok ? 'ok' : ''}">${ok ? '✓ Вы проголосовали' : n + ' ' + plural(n, 'кандидат', 'кандидата', 'кандидатов')}</em>
      </button>`;
    });
    h += '</div>';
  }

  if (!list.length && !subs.length) h += '<div class="empty">Кандидатов пока нет.</div>';
  if (list.length && subs.length) h += '<h3 class="sect">Кандидаты этой категории</h3>';
  list.forEach(c => {
    const v = S.res[c.id] || 0;
    const pct = total ? Math.round(v / total * 1000) / 10 : 0;
    const lead = total > 0 && v === max;
    const img = c.image_url ? `<button type="button" class="avatar" data-act="zoom" data-id="${c.id}" aria-label="Открыть фото на весь экран"><img src="${esc(c.image_url)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.remove()"></button>` : '';
    let acts = '';
    if (voted === c.id) acts += '<span class="mine">✓ Ваш голос</span>';
    else if (!voted) acts += `<button class="btn sm" data-act="vote" data-id="${c.id}" ${session ? '' : 'disabled'}>Голосовать</button>`;
    if (S.admin) acts += `<button class="btn ghost sm" data-act="pick-img" data-id="${c.id}">Фото</button>
                          <button class="btn ghost sm" data-act="edit-cand" data-id="${c.id}">Изменить</button>
                          <button class="btn danger sm" data-act="del-cand" data-id="${c.id}">Удалить</button>`;
    h += `<article class="cand ${lead ? 'lead' : ''}" style="--p:${pct}%">
      <div class="fill"></div>
      <div class="cbody">${img}
        <div class="ctext"><h3>${esc(c.name)}</h3>${c.description ? `<p class="cdesc">${esc(c.description)}</p><button type="button" class="more" data-act="more" data-id="${c.id}" hidden>Далее</button>` : ''}</div>
        <div class="cnum"><b>${pct}%</b><span>${v} ${plural(v, 'голос', 'голоса', 'голосов')}</span></div>
      </div>
      ${acts ? `<div class="cactions">${acts}</div>` : ''}
    </article>`;
  });
  if (list.length) h += `<p class="total">Всего голосов: ${total}</p>`;
  if (!session && (list.length || subs.length)) h += '<p class="total">Голосование временно недоступно: не удалось получить анонимный доступ.</p>';

  if (S.admin){
    const canMove = !subs.length;
    const popts = tops().filter(c => c.id !== cat.id)
      .map(c => `<option value="${c.id}" ${cat.parent_id===c.id?'selected':''}>${esc(c.name)}</option>`).join('');
    h += '<div class="admin-pair">';
    if (!subs.length){
      h += `<div class="card"><h3>Добавить кандидата</h3>
        <div id="single">
          <label>Имя<input id="cName" maxlength="80"></label>
          <label>Описание (необязательно)<input id="cDesc" maxlength="500"></label>
        </div>
        <div style="margin:12px 0 6px;color:var(--muted,#b9b3d9)">Картинка кандидата (необязательно)</div>
        <div class="btn" style="position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:8px">📷 Выбрать картинку
          <input id="cFiles" type="file" accept="image/*" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:100px;padding:0;border:0">
        </div>
        <div id="pend"></div>
        <button class="btn" data-act="add-cand" data-id="${cat.id}">Добавить</button></div>`;
    }
    h += `<div class="card"><h3>Изменить категорию</h3>
      <label>Название<input id="eName" maxlength="60" value="${esc(cat.name)}"></label>
      <label>Описание<textarea id="eDesc" maxlength="1000">${esc(cat.description || '')}</textarea></label>
      ${canMove ? `<label>Расположение<select id="eParent"><option value="">Основная категория</option>${popts}</select></label>` : ''}
      <div class="row">
        <button class="btn" data-act="save-cat" data-id="${cat.id}">Сохранить</button>
        ${!parent ? `<button class="btn ghost" data-act="new-sub" data-id="${cat.id}">+ Подкатегория</button>` : ''}
        <button class="btn danger" data-act="del-cat" data-id="${cat.id}">Удалить</button>
      </div></div>`;
    h += '</div>';
  }
  return h;
}

/* ===== Действия ===== */
const val = id => ($(id).value || '').trim();

/* ===== Картинки: загрузка файлов со сжатием ===== */
let PEND = [], pickUntil = 0, gotFiles = false;
document.addEventListener('click', e => { if (e.target.id === 'cFiles'){ pickUntil = Date.now() + 180000; gotFiles = false; } }, true);
/* Если после закрытия выбора файлов ничего не пришло — покажем подсказку */
document.addEventListener('visibilitychange', () => {
  if (document.hidden || !pickUntil) return;
  setTimeout(() => {
    if (gotFiles || !pickUntil) return;
    const box = $('#pend');
    if (box && !PEND.length) box.innerHTML = '<p class="total" style="color:var(--gold)">Файлы не пришли на сайт. Похоже, этот браузер не передаёт выбранные картинки — открой сайт в обычном Chrome.</p>';
  }, 2500);
});
document.addEventListener('cancel', () => { pickUntil = 0; }, true);
function fileToDataUrl(file, max = 900){
  return new Promise((ok, fail) => {
    const fr = new FileReader();
    fr.onerror = () => fail(new Error('Не удалось прочитать файл'));
    fr.onload = () => {
      const im = new Image();
      im.onload = () => {
        const k = Math.min(1, max / Math.max(im.width, im.height));
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(im.width * k)); c.height = Math.max(1, Math.round(im.height * k));
        const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
        g.drawImage(im, 0, 0, c.width, c.height);
        ok(c.toDataURL('image/jpeg', 0.82));
      };
      im.onerror = () => fail(new Error('Формат картинки не поддерживается: ' + (file.type || file.name)));
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function renderPend(){
  const box = $('#pend'); if (!box) return;
  box.innerHTML = PEND.length ? `<div class="row" style="align-items:center;margin:8px 0;gap:10px">
    <img src="${PEND[0].data}" alt="" style="width:56px;height:56px;border-radius:50%;object-fit:cover;flex:0 0 auto">
    <span style="flex:1">Картинка выбрана</span>
    <button type="button" class="btn danger sm" data-pdel="0">✕</button></div>` : '';
}
async function onPick(e){
  if (e.target.id === 'cFiles'){
    pickUntil = 0;
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    gotFiles = true;
    try { e.target.value = ''; } catch (x) {}
    try { PEND = [{ data: await fileToDataUrl(f) }]; renderPend(); toast('Картинка выбрана. Нажми «Добавить»'); }
    catch (err) { toast(err.message); }
  }
  else if (e.target.id === 'imgPick'){
    pickUntil = 0;
    const f = e.target.files && e.target.files[0], id = e.target.dataset.id;
    if (!f) return;
    try { e.target.value = ''; } catch (x) {}
    if (!id || !S.admin) return;
    try {
      const image_url = await fileToDataUrl(f);
      await api('PATCH', 'candidates?id=eq.' + id, { image_url });
      S.cands.find(x => x.id === id).image_url = image_url; render(); toast('Фото обновлено');
    } catch (err) { toast('Ошибка: ' + err.message); }
  }
}
document.addEventListener('change', onPick);
document.addEventListener('input', onPick);
document.addEventListener('input', e => { if (e.target.dataset && e.target.dataset.pn !== undefined) PEND[+e.target.dataset.pn].name = e.target.value; });
document.addEventListener('click', e => {
  const d = e.target.closest('[data-pdel]'); if (d){ PEND.splice(+d.dataset.pdel, 1); renderPend(); }
});

async function act(a, id){
  try {
    if (a === 'vote'){
      const cand = S.cands.find(c => c.id === id);
      if (!confirm(`Голосовать за «${cand.name}»? Изменить голос в этой категории нельзя.`)) return;
      try { await api('POST', 'votes', { category_id:cand.category_id, candidate_id:id }); toast('Голос принят'); }
      catch (e) { if (e.code === '23505') toast('Вы уже голосовали в этой категории'); else throw e; }
      await loadResults(); render();
    }
    else if (a === 'zoom') openZoom(id);
    else if (a === 'more') openSheet(id);
    else if (a === 'login-open'){ $('#lErr').textContent=''; $('#dlg').showModal(); }
    else if (a === 'logout'){
      if (session) authPost('/logout', {}, session.access_token);
      dropSession(); S.admin = false; await loadAll(); toast('Вы вышли');
    }
    else if (a === 'save-rules'){
      await api('PATCH', 'settings?id=eq.1', { title: val('#fTitle') || 'Голосование', rules: $('#fRules').value });
      S.title = val('#fTitle') || 'Голосование'; S.rules = $('#fRules').value; render(); toast('Сохранено');
    }
    else if (a === 'new-sub') setTab('new', id);
    else if (a === 'add-cat'){
      const name = val('#nName'); if (!name) return toast('Введите название');
      const body = { name, description: $('#nDesc').value.trim() };
      const parent = $('#nParent').value;
      if (parent) body.parent_id = parent;
      const r = await api('POST', 'categories', body, 'return=representation');
      S.cats.push(r[0]); setTab(r[0].id); toast(parent ? 'Подкатегория создана' : 'Категория создана');
    }
    else if (a === 'save-cat'){
      const name = val('#eName'); if (!name) return toast('Введите название');
      const c = catById(id);
      const patch = { name, description: $('#eDesc').value.trim() };
      const pSel = $('#eParent');
      if (pSel && pSel.value !== (c.parent_id || '')) patch.parent_id = pSel.value || null;
      await api('PATCH', 'categories?id=eq.' + id, patch);
      Object.assign(c, patch); render(); toast('Сохранено');
    }
    else if (a === 'del-cat'){
      const c = catById(id), kids = subsOf(id);
      const msg = kids.length
        ? `Удалить категорию вместе с ${kids.length} ${plural(kids.length, 'подкатегорией', 'подкатегориями', 'подкатегориями')}, всеми кандидатами и голосами?`
        : 'Удалить категорию вместе со всеми кандидатами и голосами?';
      if (!confirm(msg)) return;
      await api('DELETE', 'categories?id=eq.' + id);
      const gone = new Set([id, ...kids.map(k => k.id)]);
      S.cats = S.cats.filter(x => !gone.has(x.id)); S.cands = S.cands.filter(x => !gone.has(x.category_id));
      await loadResults();
      setTab(c && c.parent_id && catById(c.parent_id) ? c.parent_id : 'rules'); toast('Категория удалена');
    }
    else if (a === 'add-cand'){
      const name = val('#cName'); if (!name) return toast('Введите имя кандидата');
      const rows = [{ category_id:id, name, description:val('#cDesc'), image_url: PEND.length ? PEND[0].data : '' }];
      const r = await api('POST', 'candidates', rows, 'return=representation');
      S.cands.push(...r); render(); toast(r.length > 1 ? 'Кандидаты добавлены: ' + r.length : 'Кандидат добавлен');
    }
    else if (a === 'edit-cand'){
      const c = S.cands.find(x => x.id === id);
      const name = prompt('Имя кандидата', c.name); if (name === null) return;
      const description = prompt('Описание', c.description); if (description === null) return;
      if (!name.trim()) return toast('Имя не может быть пустым');
      await api('PATCH', 'candidates?id=eq.' + id, { name:name.trim(), description:description.trim() });
      Object.assign(c, { name:name.trim(), description:description.trim() }); render(); toast('Сохранено');
    }
    else if (a === 'pick-img'){ const p = $('#imgPick'); p.dataset.id = id; pickUntil = Date.now() + 180000; p.click(); }
    else if (a === 'del-cand'){
      if (!confirm('Удалить кандидата вместе с его голосами?')) return;
      await api('DELETE', 'candidates?id=eq.' + id);
      S.cands = S.cands.filter(c => c.id !== id); await loadResults(); render(); toast('Удалено');
    }
  } catch (e) {
    if (/parent_id/.test(e.message || '')) toast('Для подкатегорий нужно один раз выполнить subcategories.sql в Supabase');
    else toast('Ошибка: ' + e.message);
  }
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab]');
  if (t){ setTab(t.dataset.tab); return; }
  const b = e.target.closest('[data-act]');
  if (b) act(b.dataset.act, b.dataset.id);
});

$('#lCancel').onclick = () => $('#dlg').close();
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  $('#lErr').textContent = '';
  const r = await authPost('/token?grant_type=password', { email:val('#lEmail'), password:$('#lPass').value });
  if (!saveSession(r)){ $('#lErr').textContent = 'Неверная почта или пароль'; return; }
  $('#dlg').close(); $('#lPass').value = '';
  await loadAll();
  toast(S.admin ? 'Режим администратора включён' : 'Этот аккаунт не администратор');
});

/* ===== Автообновление ===== */
let refreshing = false, dirty = false, lastSnap = '';
function busy(){
  const a = document.activeElement;
  if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return true;   // человек печатает
  if ($('#dlg').open || PEND.length || Date.now() < pickUntil) return true;
  return [...document.querySelectorAll('#main input:not([type=file]), #main textarea')].some(i => i.value !== i.defaultValue);
}
async function refresh(){
  if (document.hidden || !S.loaded || S.error || refreshing) return;
  refreshing = true;
  try {
    await ensureSession();
    const [st, cats, light] = await Promise.all([
      api('GET', 'settings?select=*&id=eq.1'),
      api('GET', 'categories?select=*&order=created_at'),
      api('GET', 'candidates?select=id,category_id,name,description&order=created_at')
    ]);
    await loadResults();
    const snap = JSON.stringify([st, cats, light, S.res, S.mine]);
    if (!lastSnap) lastSnap = snap;
    else if (snap !== lastSnap){
      const candsChanged = JSON.stringify(light) !== JSON.stringify(S.cands.map(c => ({ id:c.id, category_id:c.category_id, name:c.name, description:c.description })));
      if (candsChanged) S.cands = await api('GET', 'candidates?select=*&order=created_at');
      S.title = (st[0] && st[0].title) || 'Голосование';
      S.rules = (st[0] && st[0].rules) || '';
      S.cats = cats;
      fixTab();
      lastSnap = snap; dirty = true;
    }
    if (dirty && !busy()){ render(); dirty = false; }
  } catch (e) {}
  refreshing = false;
}
setInterval(refresh, 5000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });

loadAll();
</script>
